name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        # uv sync honours the committed uv.lock for fully reproducible installs.
        # Falls back to requirements.txt when running outside a uv-enabled clone.
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv sync --extra dev --frozen
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Syntax check scripts
        run: |
          python -c "import ast; ast.parse(open('scripts/scrape.py').read())"
          python -c "import ast; ast.parse(open('scripts/update_monthly.py').read())"
