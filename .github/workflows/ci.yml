name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        # uv sync honours the committed uv.lock for fully reproducible installs.
        # Falls back to requirements.txt when running outside a uv-enabled clone.
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv sync --extra dev --frozen
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        # uv sync installs into .venv; bare `pytest` is not on PATH there.
        # Use `uv run` inside the venv, plain `pytest` on the pip fallback.
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv run pytest tests/ -v --tb=short
          else
            pytest tests/ -v --tb=short
          fi

      - name: Lint Python (ruff)
        # Runs in the same pinned venv, so rule behaviour matches uv.lock.
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv run ruff check scripts/ tests/
          else
            ruff check scripts/ tests/
          fi

      - name: Syntax check scripts
        run: |
          for f in scrape.py update_monthly.py catalog.py discover_repos.py; do
            python -c "import ast; ast.parse(open('scripts/$f').read())"
          done

      - name: Validate catalog
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv run python scripts/catalog.py validate
          else
            python scripts/catalog.py validate
          fi

      - name: Lint catalog (soft checks)
        # Soft warnings — does not fail CI but surfaces quality drift
        run: |
          if command -v uv >/dev/null 2>&1 && [ -f uv.lock ]; then
            uv run python scripts/catalog.py lint
          else
            python scripts/catalog.py lint
          fi || true
