name: Monthly GitHub Trending Scrape

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月1日 00:00 UTC (全量抓取)
  workflow_dispatch:       # 手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --extra dev --frozen
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run scraper
        run: uv run python scripts/scrape.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data integrity
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/repos.json'))
          total = data.get('total', 0)
          repos = len(data.get('repos', []))
          print(f'Data check: total={total}, repos={repos}')
          if repos < 100:
              print(f'ERROR: Only {repos} repos found, expected >= 100. Aborting.')
              sys.exit(1)
          print('Data integrity check passed.')
          "

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update trending repos data"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Monthly scrape failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }} (${{ github.actor }})" >> $GITHUB_STEP_SUMMARY
          exit 1
