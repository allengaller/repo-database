name: Monthly GitHub Trending Scrape

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月1日 00:00 UTC (全量抓取)
  workflow_dispatch:       # 手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run scraper
        run: python scripts/scrape.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/repos.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update trending repos data"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Monthly scrape failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }} (${{ github.actor }})" >> $GITHUB_STEP_SUMMARY
          exit 1
