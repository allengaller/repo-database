name: Monthly New Repos Update

on:
  schedule:
    - cron: '0 6 1 * *'  # 每月1日 06:00 UTC (在全量抓取之后运行)
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026)'
        required: false
        default: ''
      month:
        description: 'Month 1-12'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --extra dev --frozen
          else
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Determine target month
        id: target
        env:
          INPUT_YEAR: ${{ github.event.inputs.year }}
          INPUT_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$INPUT_YEAR" ]; then
            YEAR="$INPUT_YEAR"
            MONTH="$INPUT_MONTH"
          else
            # Default: previous month
            YEAR=$(date -d "last month" +%Y)
            MONTH=$(date -d "last month" +%m)
          fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "tag=${YEAR}-${MONTH}" >> $GITHUB_OUTPUT

      - name: Fetch monthly repos
        run: |
          uv run python scripts/update_monthly.py \
            --year ${{ steps.target.outputs.year }} \
            --month ${{ steps.target.outputs.month }} \
            --report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh catalog profiles
        run: |
          uv run python scripts/catalog.py refresh
          uv run python scripts/catalog.py index
          uv run python scripts/catalog.py validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          REPORT="data/monthly_report_${{ steps.target.outputs.tag }}.md"
          echo "## 📊 Monthly New Repos — ${{ steps.target.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ catalog/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update monthly repos for ${{ steps.target.outputs.tag }}"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main'
            });
            core.info('Triggered deploy-pages workflow');

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Monthly update failed for ${{ steps.target.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.event_name }} (${{ github.actor }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs at the link above." >> $GITHUB_STEP_SUMMARY
          exit 1
